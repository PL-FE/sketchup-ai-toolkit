<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型预览工作台</title>
<link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head>
<body><header><div><span class="eyebrow">DESIGN PREVIEW</span><h1 id="title">模型预览工作台</h1></div><div class="actions"><span id="revision" class="badge">载入中</span><button id="undo" disabled>撤销</button><button id="redo" disabled>重做</button><button id="reset-all" title="恢复本次载入方案的初始参数；可以撤销">重置方案</button><button id="save">导出方案</button><button id="import">导入方案</button><input id="file" type="file" accept=".json,application/json" hidden></div></header>
<main><section class="viewport"><nav id="views"><button data-view="perspective" class="active">自由视角</button><button data-view="iso">轴测</button><button data-view="front">正视</button><button data-view="side">右视</button><button data-view="top">俯视</button><span class="spacer"></span><button id="fit">适应画面</button><button id="snapshot">保存图片</button></nav><div id="stage"><div id="loading">正在加载本地三维预览…</div><div id="error" hidden></div><div class="hint">拖动旋转 · 滚轮缩放 · 右键平移</div><div id="mode" class="mode">整体</div></div><section id="gallery"><div class="section-head"><h2>局部组件</h2><span>点击卡片，查看与调整对应组件</span></div><div id="cards"></div></section></section>
<aside><div class="section-head"><h2>组件与参数</h2><button id="all">返回整体</button></div><label class="field">选择组件<select id="selection"></select></label><div class="actions"><button id="isolate">单独查看</button><button id="visible">隐藏组件</button><button id="reset-component" title="仅恢复当前组件的初始参数；可以撤销">重置当前组件</button></div><div id="editor"></div><details><summary>当前方案说明</summary><p id="notes"></p><p>参数单位：米；旋转：度。坐标：X 水平、Y 向上、Z 纵深。</p><p>这是可调整的形态预览。导出方案仅保存当前状态，不代表已批准建模。</p><button id="reload">重新读取场景文件</button></details></aside></main>
<footer><span id="status" role="status">本地预览，不消耗生图额度</span><span>整体与局部共用同一份参数</span></footer><script type="module" src="app.js"></script></body></html>
